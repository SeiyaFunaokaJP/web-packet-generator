name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The optional libpcap backend (needs libpcap-dev, installed above).
      - run: cargo clippy -p wpg-tx -p wpg-rx -p wpg-cli --all-targets --features wpg-tx/pcap,wpg-rx/pcap,wpg-cli/pcap -- -D warnings
      # The optional AF_XDP backend (no extra build dependencies).
      - run: cargo clippy -p wpg-tx -p wpg-cli --all-targets --features wpg-tx/afxdp,wpg-cli/afxdp -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo test --workspace
      # Windows is left out on purpose: linking the pcap backend needs the Npcap SDK.
      - name: Test the pcap backend (Linux / macOS)
        if: runner.os != 'Windows'
        run: cargo test -p wpg-tx -p wpg-rx --features wpg-tx/pcap,wpg-rx/pcap
      # AF_XDP compiles to nothing outside Linux; on Linux the socket tests run when
      # the runner may create XDP sockets (they skip without the privileges).
      - name: Test the AF_XDP backend
        run: cargo test -p wpg-tx --features afxdp

  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p wpg-core -p wpg-protocols -p wpg-i18n --target wasm32-unknown-unknown

  # Playwright tests of the web UI against a real `wpg serve` (e2e/README.md).
  e2e:
    name: e2e (web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the web UI
        working-directory: crates/wpg-web
        run: trunk build --release
      # Built after dist/ exists so rust-embed serves the UI.
      - run: cargo build -p wpg-cli
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Optional (M1): cross-check the golden pcaps against Wireshark's dissector.
  tshark:
    name: tshark cross-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: WPG_TSHARK=1 cargo test -p wpg-golden-tests --test tshark -- --ignored

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Deployment / packaging scripts (M10).
  scripts:
    name: shellcheck / systemd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh scripts/lib/*.sh docs/build.sh
      - run: systemd-analyze verify packaging/systemd/wpg.service 2>&1 | grep -v 'is not executable' | tee /dev/stderr | (! grep .)
