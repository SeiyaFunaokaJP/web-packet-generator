name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The optional libpcap backend (needs libpcap-dev, installed above).
      - run: cargo clippy -p wpg-tx -p wpg-rx -p wpg-cli --all-targets --features wpg-tx/pcap,wpg-rx/pcap,wpg-cli/pcap -- -D warnings
      # The optional AF_XDP backend (no extra build dependencies).
      - run: cargo clippy -p wpg-tx -p wpg-cli --all-targets --features wpg-tx/afxdp,wpg-cli/afxdp -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo test --workspace
      # Windows is left out on purpose: linking the pcap backend needs the Npcap SDK.
      - name: Test the pcap backend (Linux / macOS)
        if: runner.os != 'Windows'
        run: cargo test -p wpg-tx -p wpg-rx --features wpg-tx/pcap,wpg-rx/pcap
      # AF_XDP compiles to nothing outside Linux; on Linux the socket tests run when
      # the runner may create XDP sockets (they skip without the privileges).
      - name: Test the AF_XDP backend
        run: cargo test -p wpg-tx --features afxdp

  # dpdk-sys (bindgen + C shim) against both supported DPDK LTS releases (ADR-0004):
  # 23.11 from Ubuntu 24.04, 24.11 from Debian 13. The smoke test runs EAL without
  # hugepages or PCI on virtual ports (net_ring / net_pcap / net_null), so no NIC or
  # privileges are needed.
  dpdk:
    name: dpdk (${{ matrix.dpdk }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dpdk: "24.11"
            image: debian:trixie
          - dpdk: "23.11"
            image: ubuntu:24.04
    steps:
      - name: Install DPDK and libclang
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config dpdk-dev libclang-dev
          pkg-config --modversion libdpdk
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: dpdk-${{ matrix.dpdk }}
      - run: cargo clippy -p dpdk-sys -p wpg-tx -p wpg-cli --all-targets --features dpdk-sys/link,wpg-tx/dpdk,wpg-cli/dpdk -- -D warnings
      - run: cargo test -p dpdk-sys --features link
      # The dpdk backend on net_ring / net_pcap / net_null virtual devices (no hugepages).
      - run: cargo test -p wpg-tx --features dpdk --lib dpdk

  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p wpg-core -p wpg-protocols -p wpg-i18n --target wasm32-unknown-unknown

  # Playwright tests of the web UI against a real `wpg serve` (e2e/README.md).
  e2e:
    name: e2e (web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the web UI
        working-directory: crates/wpg-web
        run: trunk build --release
      # Built after dist/ exists so rust-embed serves the UI.
      - run: cargo build -p wpg-cli
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Cross-check the golden pcaps against Wireshark's dissector (required since M12:
  # every P0 / P1 golden case has decoded-field expectations).
  tshark:
    name: tshark cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: WPG_TSHARK=1 cargo test -p wpg-golden-tests --test tshark -- --ignored

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Deployment / packaging scripts (M10).
  scripts:
    name: shellcheck / systemd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh scripts/lib/*.sh docs/build.sh
      - run: systemd-analyze verify packaging/systemd/wpg.service 2>&1 | grep -v 'is not executable' | tee /dev/stderr | (! grep .)
      # deploy.sh without a host: the command lines it would run (no SSH connection).
      - name: deploy.sh --dry-run
        run: |
          ./scripts/deploy.sh ubuntu@192.0.2.10 --service --iface eth1 --binary /bin/true --dry-run
          ./scripts/deploy.sh ubuntu@192.0.2.10 --service --build-on-host --source git --git-ref main --terminal --snmp-trap --dry-run
          # An answer file with two hosts, checked without connecting.
          printf 'user=ubuntu\nbinary_source=file\nbinary_file=/bin/true\n[host a]\nhost=192.0.2.11\n[host b]\nhost=192.0.2.12\nifaces=eth1\n' >"$RUNNER_TEMP/deploy.conf"
          ./scripts/deploy.sh --config "$RUNNER_TEMP/deploy.conf" --check-config --json | python3 -m json.tool
      # The Windows scripts must parse in Windows PowerShell 5.1 (no PowerShell 7-only
      # syntax), and deploy.ps1 needs its UTF-8 BOM for the Japanese prompts.
      - name: PowerShell scripts (syntax, 5.1 compatibility)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts/*.ps1, packaging/windows/*.ps1)
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          $bytes = [System.IO.File]::ReadAllBytes("scripts/deploy.ps1")
          if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { Write-Host "::error file=deploy.ps1::UTF-8 BOM missing"; $failed = $true }
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $settings = @{ IncludeRules = @('PSUseCompatibleSyntax'); Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1', '7.0') } } }
            foreach ($f in $files) {
              foreach ($d in (Invoke-ScriptAnalyzer -Path $f.FullName -Settings $settings)) {
                Write-Host "::error file=$($f.Name)::$($d.Line): $($d.Message)"; $failed = $true
              }
            }
          } else {
            Write-Host "PSScriptAnalyzer not installed; skipped the 5.1 compatibility check"
          }
          if ($failed) { exit 1 }
      - run: grep -q $'\r$' scripts/deploy.bat && ! LC_ALL=C grep -qP '[^\x00-\x7F]' scripts/deploy.bat
