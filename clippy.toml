# MSRV is taken from `rust-version` in the workspace Cargo.toml.

# Networking acronyms / identifiers that `clippy::doc_markdown` must not ask to backtick.
doc-valid-idents = [
    "IPv4", "IPv6", "ICMPv4", "ICMPv6", "OSPFv2", "OSPFv3", "IS-IS", "CLNP", "ES-IS",
    "NSAP", "EtherType", "VLAN", "QinQ", "VXLAN", "DPDK", "AF_XDP", "AF_PACKET",
    "TPACKET_V3", "Npcap", "WebSocket", "OpenAPI", "YAML", "JSON", "WASM", "..",
]
too-many-arguments-threshold = 8
