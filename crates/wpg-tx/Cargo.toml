[package]
name = "wpg-tx"
description = "Transmit backends (null, pcap, AF_PACKET, AF_XDP, DPDK) behind the TxBackend trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `afpacket` is on by default; on non-Linux targets the module is simply absent
# (see `#[cfg(all(feature = "afpacket", target_os = "linux"))]` in lib.rs).
default = ["afpacket"]
# Each backend pulls in its own optional dependencies.
pcap = ["dep:pcap"]
afpacket = []
afxdp = []
dpdk = []

[dependencies]
wpg-core.workspace = true
thiserror.workspace = true
serde.workspace = true
# libpcap / Npcap backend (feature `pcap`). Needs libpcap-dev (Linux), built in on macOS,
# the Npcap SDK (`wpcap.lib` on LIB) on Windows.
pcap = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# AF_PACKET backend and `sched_setaffinity` core pinning.
libc = "0.2.186"

[dev-dependencies]
wpg-protocols.workspace = true
wpg-testutil.workspace = true
serde_json.workspace = true

[lints]
workspace = true
