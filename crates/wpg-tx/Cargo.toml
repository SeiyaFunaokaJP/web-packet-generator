[package]
name = "wpg-tx"
description = "Transmit backends (null, pcap, AF_PACKET, AF_XDP, DPDK) behind the TxBackend trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `afpacket` is on by default; on non-Linux targets the module is simply absent
# (see `#[cfg(all(feature = "afpacket", target_os = "linux"))]` in lib.rs).
default = ["afpacket"]
# Each backend pulls in its own optional dependencies.
pcap = ["dep:pcap"]
afpacket = []
# AF_XDP backend (Linux 5.10+). Talks to the kernel ABI directly (no libbpf /
# libxdp), so it needs no extra build dependencies; off by default while it has
# only been verified in copy mode (see docs/*/src/operations/dpdk-afxdp.md).
afxdp = []
# DPDK backend (Linux). Links DPDK 24.11 / 23.11 LTS through `dpdk-sys` (needs the DPDK
# development package and libclang at build time, see ADR-0004); off by default.
dpdk = ["dep:dpdk-sys"]

[dependencies]
wpg-core.workspace = true
thiserror.workspace = true
serde.workspace = true
# libpcap / Npcap backend (feature `pcap`). Needs libpcap-dev (Linux), built in on macOS,
# the Npcap SDK (`wpcap.lib` on LIB) on Windows.
pcap = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# AF_PACKET / AF_XDP backends, `sched_setaffinity` core pinning, `mbind`.
libc = "0.2.186"
dpdk-sys = { workspace = true, features = ["link"], optional = true }

[dev-dependencies]
wpg-protocols.workspace = true
wpg-template.workspace = true
proptest = "1"
wpg-testutil.workspace = true
serde_json.workspace = true

[lints]
workspace = true
