[package]
name = "wpg-snmp"
description = "SNMP manager library for wpg: BER codec, v1/v2c/v3 (USM) client, trap receiver, MIB parser, readable values, pcap recording"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# SNMPv3 USM (RFC 3414 / 3826 / 7860): only the hash and block cipher primitives;
# HMAC and the CBC / CFB modes are a few lines in `usm.rs`.
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
aes = "0.9"
des = "0.9"
getrandom = "0.4"

[dev-dependencies]
serde_json.workspace = true
wpg-core.workspace = true
wpg-protocols.workspace = true

[lints]
workspace = true
