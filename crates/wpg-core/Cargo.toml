[package]
name = "wpg-core"
description = "Protocol definition IR, packet build/parse and field generators for wpg (OS independent, builds for WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Keep this crate free of OS / networking / async dependencies: it must build for
# `wasm32-unknown-unknown` so the browser can preview packets with the same code.
[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_yaml = { workspace = true, optional = true }

[features]
default = ["yaml"]
# YAML (de)serialisation of protocol definitions (`ProtocolDef::from_yaml`), used by the
# user-extension `protocols.d/` mechanism. Pure Rust, also builds for wasm32.
yaml = ["dep:serde_yaml"]

[dev-dependencies]
serde_json.workspace = true
proptest = "1"

[lints]
workspace = true
