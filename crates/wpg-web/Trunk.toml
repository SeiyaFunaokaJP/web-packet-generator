# Build: `trunk build --release` (from this directory) -> ./dist, which wpg-server embeds
#        (rust-embed; rebuild wpg-server / wpg-cli afterwards in release mode).
# Dev:   `wpg serve --dev` on :8080, then `trunk serve` on :8081 with /api (incl. the
#        WebSocket) proxied to it.

[build]
target = "index.html"
dist = "dist"

[tools]
# Standalone Tailwind CLI, downloaded by Trunk on first use (`data-trunk rel="tailwind-css"`).
tailwindcss = "4.1.13"

[serve]
addresses = ["127.0.0.1"]
port = 8081

# The WebSocket first: Trunk matches proxies in order.
[[proxy]]
backend = "ws://127.0.0.1:8080/api/ws"
ws = true

[[proxy]]
backend = "http://127.0.0.1:8080/api/"
