[package]
name = "wpg-server"
description = "axum HTTP/WebSocket server for wpg with the web UI embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Forwarded to wpg-tx / wpg-rx: the libpcap / Npcap backends.
pcap = ["wpg-tx/pcap", "wpg-rx/pcap"]

[dependencies]
wpg-core.workspace = true
wpg-i18n.workspace = true
wpg-protocols.workspace = true
wpg-sys.workspace = true
wpg-template.workspace = true
wpg-tx.workspace = true
wpg-rx.workspace = true
wpg-log.workspace = true
wpg-snmp.workspace = true
wpg-dhcp.workspace = true
axum = { workspace = true, features = ["ws", "macros"] }
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
indexmap = { version = "2", features = ["serde"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "registry"] }
# `wpg.toml` + `WPG_*` environment + CLI overrides (spec §1.2 "設定").
figment = { version = "0.10", features = ["toml", "env"] }
toml = "1.1"
# JSON Schema of `Config` (the generated configuration reference).
schemars = "1"
# `wpg config set-password` edits wpg.toml keeping its comments.
toml_edit = "0.25"
# Default data directory (`~/.local/share/wpg` etc.).
directories = "6"
# Template library hot reload (spec §2.4).
notify = "8"
notify-debouncer-mini = "0.7"
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace", "cors", "request-id", "util"] }
uuid = { version = "1", features = ["v4"] }
# OpenAPI document + Swagger UI (vendored: no download at build time).
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
# Authentication / TLS (spec §2.6, ADR-0003): SQLite for users / sessions / history,
# argon2id password hashes, rustls (ring provider: no C toolchain beyond cc) with
# self-signed certificates from rcgen.
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# Web terminal (ADR-0011): pure-Rust SSH client on the ring crypto backend (no
# aws-lc / C toolchain beyond cc, like rustls above).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }

[dev-dependencies]
tempfile = "3"
figment = { version = "0.10", features = ["toml", "env", "test"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }

[lints]
workspace = true
