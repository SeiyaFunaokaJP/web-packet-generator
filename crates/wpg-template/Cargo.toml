[package]
name = "wpg-template"
description = "wpg template file format (.wpg.yaml / JSON), schema versioning and (de)serialisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
wpg-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
indexmap = { version = "2", features = ["serde"] }
# `.wpgbundle` archives (deflate only; no encryption / bzip2 / zstd).
zip = { version = "9.0", default-features = false, features = ["deflate"] }
schemars = { version = "1", default-features = true, features = ["indexmap2"] }

[dev-dependencies]
wpg-protocols.workspace = true
wpg-testutil.workspace = true

[lints]
workspace = true
