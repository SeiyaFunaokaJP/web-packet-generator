# UDP QoS matrix: every combination of DSCP (CS0/AF41/EF/CS6) and destination port (5004/5060/53)
schema: 1

meta:
  name: scenario-udp-qos-matrix
  descriptions:
    ja: "UDP QoS マトリクス: DSCP (CS0/AF41/EF/CS6) x 宛先ポート (5004/5060/53) を全組み合わせ送出"
    en: "UDP QoS matrix: every combination of DSCP (CS0/AF41/EF/CS6) and destination port (5004/5060/53)"
  tags: [scenario, "protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l4", qos, udp]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
    generators:
      dscp: 0,34,46,48
  - protocol: udp
    fields:
      src_port: 40000
    generators:
      dst_port: 5004,5060,53
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 160

stream:
  mode: product

tx:
  count: 1200
  rate: 10kpps
