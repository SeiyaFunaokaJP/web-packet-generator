# Traceroute-like TTL sweep: ICMP echo requests with TTL 1-30, three probes each
schema: 1

meta:
  name: scenario-ttl-sweep
  descriptions:
    ja: "TTL スイープ (traceroute 風): TTL 1-30 の ICMP エコー要求を 3 回ずつ"
    en: "Traceroute-like TTL sweep: ICMP echo requests with TTL 1-30, three probes each"
  tags: [scenario, "protocol:ethernet2", "protocol:ipv4", "protocol:icmpv4", "layer:l3", icmp, traceroute]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address
  - name: dst_ip
    default: 198.51.100.1

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: ${dst_ip}
    generators:
      ttl: 1-30
  - protocol: icmpv4
    fields:
      type: echo_request
      rest: "12 34 00 01"
  - protocol: payload
    fields:
      mode: pattern
      length: 32

stream:
  count: 90 # the range wraps around: 3 passes over TTL 1-30

tx:
  rate: 20pps
