# [Malformed] Truncated: IPv4 total_length claims 1000 octets, but the frame ends right after the UDP header
schema: 1

meta:
  name: truncated-ipv4-udp
  descriptions:
    ja: "[異常系] 切り詰め: IPv4 total_length は 1000 だがフレームは UDP ヘッダ直後 (payload なし) で終わる"
    en: "[Malformed] Truncated: IPv4 total_length claims 1000 octets, but the frame ends right after the UDP header"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l3", malformed, sample, truncated]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
      total_length: 1000
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
      length: 980 # says 972 payload octets follow; none do

packet:
  pad_to_min: false

tx:
  count: 1
