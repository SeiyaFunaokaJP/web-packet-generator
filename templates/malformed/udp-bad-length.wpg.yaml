# [Malformed] UDP length forced to 4, smaller than the 8-octet header
schema: 1

meta:
  name: bad-udp-length
  descriptions:
    ja: "[異常系] UDP length を 4 (ヘッダ 8 オクテット未満) にした"
    en: "[Malformed] UDP length forced to 4, smaller than the 8-octet header"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l4", malformed, sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
      length: 4
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

tx:
  count: 1
