# [Malformed] TCP SYN whose checksum is forced to 0xbeef
schema: 1

meta:
  name: bad-tcp-checksum
  descriptions:
    ja: "[異常系] TCP SYN のチェックサムを手動値 0xbeef にした"
    en: "[Malformed] TCP SYN whose checksum is forced to 0xbeef"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:tcp", "layer:l4", malformed, sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: tcp
    fields:
      dst_port: 80
      flags: syn
      checksum: 0xbeef

tx:
  count: 1
