# [Malformed] UDP checksum forced to 0x1234 (does not match the pseudo header)
schema: 1

meta:
  name: bad-udp-checksum
  descriptions:
    ja: "[異常系] UDP チェックサムを手動値 0x1234 にした (疑似ヘッダと不一致)"
    en: "[Malformed] UDP checksum forced to 0x1234 (does not match the pseudo header)"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l4", malformed, sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
      checksum: 0x1234
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

tx:
  count: 1
