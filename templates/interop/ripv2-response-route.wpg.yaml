# Interop: RIPv2 Response that advertises routes; the peer installs them in its RIB
schema: 1

meta:
  name: interop-ripv2-response-route
  descriptions:
    ja: "相互接続確認: RIPv2 Response で 2 経路を 30 秒ごとに広告し、相手の RIB に R (RIP) 経路として載ることを確認"
    en: "Interop check: RIPv2 Responses advertising two routes every 30 s; the peer installs them as R (RIP) routes"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "protocol:rip", "layer:l4", interop, rip]
  author: wpg
  created: 2026-10-12

variables:
  - name: src_ip
    default: 10.99.0.1
    description: Source address of wpg (on the peer's subnet)
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC of wpg

layers:
  - protocol: ethernet2
    fields:
      dst: "01:00:5e:00:00:09" # RIPv2 routers 224.0.0.9
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: ${src_ip}
      dst: 224.0.0.9
      ttl: 1
  - protocol: udp
    fields:
      src_port: 520
      dst_port: 520
  - protocol: rip
    fields:
      command: response
      version: 2
      entries:
        - { afi: 2, route_tag: 0, address: 198.51.100.0, subnet_mask: 255.255.255.0, next_hop: 0.0.0.0, metric: 1 }
        - { afi: 2, route_tag: 100, address: 203.0.113.0, subnet_mask: 255.255.255.128, next_hop: 0.0.0.0, metric: 5 }

tx:
  count: 6 # three minutes (the route times out 180 s after the last update)
  rate: ifg=30s
