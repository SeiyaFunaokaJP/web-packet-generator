        - error_spec_ipv4: { node_address: 10.0.12.2, flags: 0, error_code: routing_problem, error_value: 5 }
        - sender_template_lsp_tunnel_ipv4: { sender_address: 192.0.2.1, lsp_id: 1 }
        - sender_tspec: {}

