    en: "RSVP (RFC 2205 / RFC 3209): a PathErr with an ERROR_SPEC (Routing Problem / No route available toward destination)"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:rsvp", "layer:l4", mpls, sample]
  author: wpg
  created: 2026-10-12

