# SCTP (RFC 9260): an ABORT with the T bit and a user initiated abort cause
schema: 1

meta:
  name: sctp-abort
  descriptions:
    ja: "SCTP (RFC 9260): T ビットとユーザ起因 ABORT 原因付きの ABORT"
    en: "SCTP (RFC 9260): an ABORT with the T bit and a user initiated abort cause"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:sctp", "layer:l4", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4 # protocol 132 is Auto
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: sctp
    fields:
      src_port: 5001
      dst_port: 5001
      verification_tag: 0x3a5c7e91 # reflected (T bit)
      chunks:
        - abort:
            flags: t
            causes:
              - user_initiated_abort: "73 68 75 74 64 6f 77 6e" # "shutdown"

tx:
  count: 1
