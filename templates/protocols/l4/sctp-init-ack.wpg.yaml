# SCTP (RFC 9260): an INIT ACK carrying a state cookie
schema: 1

meta:
  name: sctp-init-ack
  descriptions:
    ja: "SCTP (RFC 9260): State Cookie 付き INIT ACK"
    en: "SCTP (RFC 9260): an INIT ACK carrying a state cookie"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:sctp", "layer:l4", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4 # protocol 132 is Auto
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: sctp
    fields:
      src_port: 5001
      dst_port: 5001
      verification_tag: 0x3a5c7e91 # the initiate tag of the INIT
      chunks:
        - init_ack:
            initiate_tag: 0x1d2e3f40
            initial_tsn: 0x1d2e3f40
            parameters:
              - state_cookie: "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f 10 11 12 13"
              - ecn_capable

tx:
  count: 1
