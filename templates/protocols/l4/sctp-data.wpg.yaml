# SCTP (RFC 9260): a DATA chunk with 16 octets of user data (TSN incremented per packet)
schema: 1

meta:
  name: sctp-data
  descriptions:
    ja: "SCTP (RFC 9260): 16 オクテットのユーザデータを持つ DATA チャンク (TSN を 1 ずつ増加)"
    en: "SCTP (RFC 9260): a DATA chunk with 16 octets of user data (TSN incremented per packet)"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:sctp", "layer:l4", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4 # protocol 132 is Auto
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: sctp
    fields:
      src_port: 5001
      dst_port: 5001
      verification_tag: 0x1d2e3f40
      chunks:
        # `data` is also a reserved item key, so the chunk is written as {name, fields}.
        - name: data
          fields:
            flags: b|e # unfragmented message
            tsn: 0x3a5c7e91
            stream_identifier: 1
            stream_sequence_number: 0
            payload_protocol_identifier: 0
            user_data: "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f"

tx:
  count: 1
