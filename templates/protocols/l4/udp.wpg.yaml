# UDP datagram (ports and payload length are variables)
schema: 1

meta:
  name: udp-datagram
  descriptions:
    ja: "UDP データグラム (送信元ポート・宛先ポート・payload 長を変数化)"
    en: "UDP datagram (ports and payload length are variables)"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l4", sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address
  - name: src_port
    default: 40000
  - name: dst_port
    default: 40001
  - name: length
    default: 64
    description: Payload length in octets

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: ${src_port}
      dst_port: ${dst_port}
  - protocol: payload
    fields:
      mode: pattern
      length: ${length} # empty `data` = 00 01 02 ...

tx:
  count: 1
