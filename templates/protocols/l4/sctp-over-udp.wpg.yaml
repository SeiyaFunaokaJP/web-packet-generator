# SCTP over UDP (RFC 6951, port 9899): a COOKIE ECHO bundled with DATA
schema: 1

meta:
  name: sctp-over-udp
  descriptions:
    ja: "SCTP over UDP (RFC 6951、ポート 9899): COOKIE ECHO と DATA のバンドル"
    en: "SCTP over UDP (RFC 6951, port 9899): a COOKIE ECHO bundled with DATA"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "protocol:sctp", "layer:l4", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4 # protocol 132 is Auto
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 9899
      dst_port: 9899
  - protocol: sctp
    fields:
      src_port: 5001
      dst_port: 5001
      verification_tag: 0x1d2e3f40
      chunks:
        - cookie_echo: { cookie: "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f 10 11 12 13" }
        - name: data
          fields:
            tsn: 0x3a5c7e91
            user_data: "68 65 6c 6c 6f" # 5 octets + 3 octets of padding

tx:
  count: 1
