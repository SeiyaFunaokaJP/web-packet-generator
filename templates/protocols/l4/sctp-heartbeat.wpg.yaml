# SCTP (RFC 9260): a HEARTBEAT with a heartbeat info parameter
schema: 1

meta:
  name: sctp-heartbeat
  descriptions:
    ja: "SCTP (RFC 9260): Heartbeat Info パラメータ付き HEARTBEAT"
    en: "SCTP (RFC 9260): a HEARTBEAT with a heartbeat info parameter"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:sctp", "layer:l4", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4 # protocol 132 is Auto
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: sctp
    fields:
      src_port: 5001
      dst_port: 5001
      verification_tag: 0x3a5c7e91
      chunks:
        - heartbeat:
            parameters:
              - heartbeat_info: "c0 00 02 01 00 00 00 00 00 00 00 2a" # sender-specific

tx:
  count: 1
