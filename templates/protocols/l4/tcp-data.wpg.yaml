# TCP data segment (PSH|ACK) carrying an HTTP-GET-like text payload
schema: 1

meta:
  name: tcp-data-psh-ack
  descriptions:
    ja: "データ付き TCP セグメント (PSH|ACK、HTTP GET 風のテキスト payload)"
    en: "TCP data segment (PSH|ACK) carrying an HTTP-GET-like text payload"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:tcp", "protocol:payload", "layer:l4", sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
      flags: df
  - protocol: tcp
    fields:
      src_port: 50000
      dst_port: 80
      seq: 1001
      ack: 5001
      flags: psh|ack
      window: 65535
  - protocol: payload
    fields:
      mode: fixed
      data: "47 45 54 20 2f 20 48 54 54 50 2f 31 2e 31 0d 0a 0d 0a" # GET / HTTP/1.1 CRLF CRLF

tx:
  count: 1
