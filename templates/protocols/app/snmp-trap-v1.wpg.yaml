# SNMPv1 Trap (RFC 1157): a linkDown trap to UDP port 162 with an ifIndex variable binding
schema: 1

meta:
  name: snmp-trap-v1
  descriptions:
    ja: "SNMPv1 Trap (RFC 1157): ifIndex 付き linkDown トラップを UDP 162 番ポートへ送信"
    en: "SNMPv1 Trap (RFC 1157): a linkDown trap with an ifIndex binding sent to UDP port 162"
  tags: ["protocol:snmp", "protocol:snmp_trap", "layer:l4", app, sample, trap]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.162
  - protocol: udp
    fields:
      src_port: 50162
      dst_port: 162
  - protocol: snmp
    fields:
      version: v1
      community_length: 6
      community: '"public"'
  - protocol: snmp_trap
    fields:
      body:
        - { name: object_identifier, data: "2b 06 01 04 01 bf 08" } # enterprise 1.3.6.1.4.1.8072
        - { ip_address: 192.0.2.1 } # agent-addr
        - { type: 0x02, data: "02" } # generic-trap: linkDown
        - { type: 0x02, data: "00" } # specific-trap
        - { name: timeticks, data: "01 e2 40" } # time-stamp: 123456 (1/100 s)
        - sequence:
            items:
              - sequence:
                  items:
                    - { name: object_identifier, data: "2b 06 01 02 01 02 02 01 01 03" } # ifIndex.3
                    - { type: 0x02, data: "03" }

tx:
  count: 1
