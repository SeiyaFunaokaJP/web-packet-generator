# MLDv2 (RFC 3810): a Multicast Listener Report to ff02::16 joining ff05::1
schema: 1

meta:
  name: mldv2-report
  descriptions:
    ja: "MLDv2 (RFC 3810): ff05::1 に参加するリスナーレポート (ff02::16 宛)"
    en: "MLDv2 (RFC 3810): a Multicast Listener Report to ff02::16 joining ff05::1"
  tags: ["protocol:icmpv6", "protocol:mldv2_report", "layer:l3", multicast, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "33:33:00:00:00:16"
      src: "02:00:00:00:00:01"
  - protocol: ipv6
    fields:
      src: fe80::100
      dst: ff02::16
      hop_limit: 1
  - protocol: ipv6_hopopts
    fields:
      options: "05 02 00 00 01 00" # Router Alert (MLD) + PadN
  - protocol: icmpv6 # type: auto -> 143
  - protocol: mldv2_report
    fields:
      num_records: 1
      records:
        - record_type: change_to_exclude
          multicast_address: ff05::1

tx:
  count: 1
