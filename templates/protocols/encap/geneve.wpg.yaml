# Geneve (RFC 8926): an inner Ethernet/IPv4/UDP frame over UDP port 6081
schema: 1

meta:
  name: geneve
  descriptions:
    ja: "Geneve (RFC 8926): 内側 Ethernet/IPv4/UDP を UDP 6081 でトンネル"
    en: "Geneve (RFC 8926): an inner Ethernet/IPv4/UDP frame over UDP port 6081"
  tags: ["protocol:geneve", "layer:l2", encap, sample]
  author: wpg
  created: 2026-10-01

variables:
  - name: vni
    default: 0x123456
    description: Virtual Network Identifier

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 50000
      dst_port: 6081
  - protocol: geneve
    fields:
      vni: ${vni} # protocol_type: auto -> 0x6558 (Ethernet)
  - protocol: ethernet2
    fields:
      dst: "02:aa:00:00:00:02"
      src: "02:aa:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 10.0.0.1
      dst: 10.0.0.2
  - protocol: udp
    fields:
      src_port: 4000
      dst_port: 4001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 16

tx:
  count: 1
