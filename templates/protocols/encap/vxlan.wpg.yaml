# VXLAN (RFC 7348): an inner Ethernet/IPv4/UDP frame tunnelled over UDP port 4789
schema: 1

meta:
  name: vxlan
  descriptions:
    ja: "VXLAN (RFC 7348): 内側 Ethernet/IPv4/UDP を UDP 4789 でトンネル"
    en: "VXLAN (RFC 7348): an inner Ethernet/IPv4/UDP frame over UDP port 4789"
  tags: ["protocol:vxlan", "layer:l2", encap, sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: vni
    default: 0x123456
    description: VXLAN Network Identifier

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 50000
      dst_port: 4789
  - protocol: vxlan
    fields:
      flags: 0x08 # I bit: VNI is valid
      vni: ${vni}
  - protocol: ethernet2
    fields:
      dst: "02:aa:00:00:00:02"
      src: "02:aa:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 10.0.0.1
      dst: 10.0.0.2
  - protocol: udp
    fields:
      src_port: 4000
      dst_port: 4001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 16

tx:
  count: 1
