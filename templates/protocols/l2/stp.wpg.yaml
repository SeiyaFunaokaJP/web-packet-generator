# STP (IEEE 802.1D): a Configuration BPDU from the root bridge over 802.3 + LLC (SAP 0x42)
schema: 1

meta:
  name: stp
  descriptions:
    ja: "STP (IEEE 802.1D): ルートブリッジからの Configuration BPDU (802.3 + LLC)"
    en: "STP (IEEE 802.1D): a Configuration BPDU from the root bridge (802.3 + LLC)"
  tags: ["protocol:stp", "layer:l2", sample]
  author: wpg
  created: 2026-10-01

