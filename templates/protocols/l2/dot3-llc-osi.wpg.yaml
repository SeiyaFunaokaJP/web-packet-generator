# OSI encapsulation: a generic OSI network PDU over 802.3 + LLC (SAP 0xfe), selected by its NLPID (here the inactive subset)
schema: 1

meta:
  name: dot3-llc-osi
  descriptions:
    ja: "OSI カプセル化: 802.3 + LLC (SAP 0xfe) 上の汎用 OSI ネットワーク PDU (NLPID で判別、ここでは非活性サブセット)"
    en: "OSI encapsulation: a generic OSI network PDU over 802.3 + LLC (SAP 0xfe), told apart by its NLPID (here the inactive subset)"
  tags: ["protocol:dot3", "protocol:llc", "protocol:osi", "layer:l3", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "09:00:2b:00:00:05" # AllIntermediateSystems
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc # dsap / ssap become 0xfe automatically
  - protocol: osi
    fields:
      # NLPID 0x00: the inactive subset of ISO 8473, a transport PDU with no network
      # header (CLNP, ES-IS and IS-IS have dedicated protocols)
      nlpid: "null"
      data: "06 e0 0000 0001 00" # a TP class 0 CR TPDU (dst-ref 0, src-ref 1)

tx:
  count: 1
