# ARP reply (${sender} is-at ${src_mac}, unicast)
schema: 1

meta:
  name: arp-reply
  descriptions:
    ja: "ARP 応答 (${sender} is-at ${src_mac}、ユニキャスト)"
    en: "ARP reply (${sender} is-at ${src_mac}, unicast)"
  tags: ["protocol:ethernet2", "protocol:arp", "layer:l2", sample, arp]
  author: wpg
  created: 2026-09-29

variables:
  - name: src_mac
    default: "02:00:00:00:00:01"
  - name: dst_mac
    default: "02:00:00:00:00:02"
  - name: sender
    default: 192.0.2.1
  - name: target
    default: 192.0.2.2

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: arp
    fields:
      oper: reply
      sha: ${src_mac}
      spa: ${sender}
      tha: ${dst_mac}
      tpa: ${target}

tx:
  count: 1
