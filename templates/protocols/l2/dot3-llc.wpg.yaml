# IEEE 802.3 frame (length field) with an 802.2 LLC header (SAP 0x0e)
schema: 1

meta:
  name: dot3-llc-frame
  descriptions:
    ja: "IEEE 802.3 (長さフィールド) + 802.2 LLC (SAP 0x0e) フレーム"
    en: "IEEE 802.3 frame (length field) with an 802.2 LLC header (SAP 0x0e)"
  tags: ["protocol:dot3", "protocol:llc", "layer:l2", sample]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: dot3
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
      length: auto # octets after the 802.3 header
  - protocol: llc
    fields:
      dsap: 0x0e # any SAP; 0x0e = PROWAY (IEC 955) network management
      ssap: 0x0e
      control: ui
  - protocol: payload
    fields:
      mode: pattern
      data: "de ad be ef"
      length: 43

tx:
  count: 1
