# 802.1Q VLAN-tagged IPv4/UDP frame (VID and PCP are variables)
schema: 1

meta:
  name: dot1q-frame
  descriptions:
    ja: "802.1Q VLAN タグ付き IPv4/UDP フレーム (VID・PCP を変数化)"
    en: "802.1Q VLAN-tagged IPv4/UDP frame (VID and PCP are variables)"
  tags: ["protocol:ethernet2", "protocol:dot1q", "protocol:ipv4", "protocol:udp", "layer:l2", sample, vlan]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address
  - name: vid
    default: 100
    description: VLAN ID (1-4094)
  - name: pcp
    default: 0
    description: Priority code point (0-7)

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: dot1q # the 0x8100 TPID is written into ethernet2.ethertype automatically
    fields:
      pcp: ${pcp}
      dei: 0
      vid: ${vid}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

tx:
  count: 1
