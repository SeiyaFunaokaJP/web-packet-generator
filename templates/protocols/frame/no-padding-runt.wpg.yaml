# Runt frame: a 42-octet ARP sent without padding, to observe how NICs and switches treat runts
schema: 1

meta:
  name: runt-frame-unpadded
  descriptions:
    ja: "ランツ (パディングなし 42 オクテットの ARP)。NIC/スイッチのランツ処理の確認用"
    en: "Runt frame: a 42-octet ARP sent without padding, to observe how NICs and switches treat runts"
  tags: ["protocol:ethernet2", "protocol:arp", "layer:l2", sample, padding, runt]
  author: wpg
  created: 2026-09-29

layers:
  - protocol: ethernet2
    fields:
      dst: ff:ff:ff:ff:ff:ff
      src: "02:00:00:00:00:01"
  - protocol: arp
    fields:
      oper: request
      sha: "02:00:00:00:00:01"
      spa: 192.0.2.1
      tpa: 192.0.2.2

packet:
  pad_to_min: false

tx:
  count: 1
