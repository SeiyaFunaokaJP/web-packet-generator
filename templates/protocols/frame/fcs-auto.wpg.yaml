# Append a correct CRC-32 FCS to the frame (packet.fcs: auto)
schema: 1

meta:
  name: frame-with-fcs
  descriptions:
    ja: "FCS (CRC-32) を正しい値で末尾に付ける (packet.fcs: auto)"
    en: "Append a correct CRC-32 FCS to the frame (packet.fcs: auto)"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l2", sample, fcs]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

packet:
  fcs: auto

tx:
  count: 1
