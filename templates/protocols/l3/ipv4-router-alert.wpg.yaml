# IPv4 with a Router Alert option (RFC 2113); IHL becomes 6
schema: 1

meta:
  name: ipv4-router-alert
  descriptions:
    ja: "Router Alert オプション (RFC 2113) 付き IPv4 (IHL = 6、IGMP 等の検証用)"
    en: "IPv4 with a Router Alert option (RFC 2113); IHL becomes 6"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l3", sample, ip-options]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 224.0.0.1
      ttl: 1
      options:
        - router_alert: 0 # 94 04 00 00; ihl / padding stay automatic
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

tx:
  count: 1
