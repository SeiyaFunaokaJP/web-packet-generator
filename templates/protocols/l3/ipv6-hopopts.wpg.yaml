# IPv6/UDP with a Hop-by-Hop Options header (Router Alert + PadN)
schema: 1

meta:
  name: ipv6-hopopts-router-alert
  descriptions:
    ja: "Hop-by-Hop オプション (Router Alert + PadN) 付き IPv6/UDP"
    en: "IPv6/UDP with a Hop-by-Hop Options header (Router Alert + PadN)"
  tags: ["protocol:ethernet2", "protocol:ipv6", "protocol:ipv6_hopopts", "protocol:udp", "layer:l3", sample, ipv6-ext]
  author: wpg
  created: 2026-09-29

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv6
    fields:
      src: 2001:db8::1
      dst: 2001:db8::2
  - protocol: ipv6_hopopts # next_header / hdr_ext_len are automatic
    fields:
      options: "05 02 00 00 01 00" # Router Alert (type 5, MLD value 0) + PadN(2)
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

tx:
  count: 1
