# IPv4/UDP covering all 48 combinations of 12 DSCP code points x 4 ECN values
schema: 1

meta:
  name: ipv4-dscp-ecn-matrix
  descriptions:
    ja: "DSCP (12 種) x ECN (4 種) = 48 通りの全組み合わせを送る IPv4/UDP"
    en: "IPv4/UDP covering all 48 combinations of 12 DSCP code points x 4 ECN values"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "layer:l3", sample, qos]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
    generators:
      dscp: 0,8,10,18,26,34,40,46,48,56,16,24 # CS0 CS1 AF11 AF21 AF31 AF41 CS5 EF CS6 CS7 CS2 CS3
      ecn: 0-3
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: pattern
      data: "00 01 02 03"
      length: 32

stream:
  mode: product # the last generator (ecn) varies fastest

tx:
  count: 48
  rate: 1000pps
