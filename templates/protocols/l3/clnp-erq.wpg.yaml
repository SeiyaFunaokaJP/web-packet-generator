# CLNP (ISO 8473-1): an echo request PDU with priority and partial source routing through one IS
schema: 1

meta:
  name: clnp-erq
  descriptions:
    ja: "CLNP (ISO 8473-1): 優先度と 1 台の IS を経由する部分ソースルーティング付きエコー要求 PDU"
    en: "CLNP (ISO 8473-1): an echo request PDU with priority and partial source routing through one IS"
  tags: ["protocol:dot3", "protocol:llc", "protocol:clnp", "protocol:raw", "layer:l3", sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc
  - protocol: clnp
    fields:
      pdu_type: erq
      destination: "49.0002.0000.0000.0009.00"
      source: "49.0001.0000.0000.0001.00"
      options:
        - { priority: 7 }
        - source_routing:
            route_type: partial
            next_address: 3 # first address of the list
            addresses:
              - { address: "49.0001.0000.0000.0002.00" }
  - protocol: raw
    fields:
      data: "65 63 68 6f" # "echo"

tx:
  count: 1
