# ICMPv6 echo request (checksum computed over the IPv6 pseudo header)
schema: 1

meta:
  name: icmpv6-echo-request
  descriptions:
    ja: "ICMPv6 エコー要求 (チェックサムは IPv6 疑似ヘッダで自動計算)"
    en: "ICMPv6 echo request (checksum computed over the IPv6 pseudo header)"
  tags: ["protocol:ethernet2", "protocol:ipv6", "protocol:icmpv6", "protocol:icmpv6_echo", "layer:l3", sample, icmp, ping]
  author: wpg
  created: 2026-09-29

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv6
    fields:
      src: 2001:db8::1
      dst: 2001:db8::2
  - protocol: icmpv6 # type: auto -> 128 (echo request) from icmpv6_echo
  - protocol: icmpv6_echo
    fields:
      identifier: 0x1234
      sequence: 1
  - protocol: payload
    fields:
      mode: pattern
      data: "61 62 63 64 65 66 67 68"
      length: 32

tx:
  count: 1
