# Four IPv4 fragments (MF set, fragment offset advancing) of one datagram
schema: 1

meta:
  name: ipv4-fragments
  descriptions:
    ja: "IPv4 フラグメント (MF=1 のあと offset 進行)、4 個"
    en: "Four IPv4 fragments (MF set, fragment offset advancing) of one datagram"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:payload", "layer:l3", sample, fragmentation]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
      identification: 0x1234
      protocol: udp # the payload below is not parsed as UDP, so set it explicitly
      flags: mf
    generators:
      frag_offset: 0,25,50,75 # units of 8 octets = 200 octets per fragment
  - protocol: payload
    fields:
      mode: pattern
      data: "aa bb cc dd"
      length: 200

stream:
  count: 4

tx:
  count: 4
