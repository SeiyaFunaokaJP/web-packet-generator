# Payload mode pattern: `data` repeated up to `length` octets
schema: 1

meta:
  name: payload-pattern
  descriptions:
    ja: "payload モード pattern: `data` を `length` オクテットまで繰り返す"
    en: "Payload mode pattern: `data` repeated up to `length` octets"
  tags: ["protocol:payload", "layer:l4", sample, payload]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: pattern
      data: "de ad be ef"
      length: 128

tx:
  count: 1
