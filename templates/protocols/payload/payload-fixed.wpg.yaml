# Payload mode fixed: `data` verbatim (cut / zero-extended to `length` when set)
schema: 1

meta:
  name: payload-fixed
  descriptions:
    ja: "payload モード fixed: `data` をそのまま送出 (length で切り詰め / ゼロ埋め)"
    en: "Payload mode fixed: `data` verbatim (cut / zero-extended to `length` when set)"
  tags: ["protocol:payload", "layer:l4", sample, payload]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: fixed
      data: "77 70 67 2d 66 69 78 65 64" # wpg-fixed

tx:
  count: 1
