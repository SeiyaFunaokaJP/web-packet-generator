# Payload mode random: reproducible pseudo-random octets from a fixed seed
schema: 1

meta:
  name: payload-random
  descriptions:
    ja: "payload モード random: seed 固定の擬似乱数 payload (再現可能)"
    en: "Payload mode random: reproducible pseudo-random octets from a fixed seed"
  tags: ["protocol:payload", "layer:l4", sample, payload]
  author: wpg
  created: 2026-09-29

variables:
  - name: dst_mac
    default: "02:00:00:00:00:02"
    description: Destination MAC address
  - name: src_mac
    default: "02:00:00:00:00:01"
    description: Source MAC address

layers:
  - protocol: ethernet2
    fields:
      dst: ${dst_mac}
      src: ${src_mac}
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
  - protocol: udp
    fields:
      src_port: 40000
      dst_port: 40001
  - protocol: payload
    fields:
      mode: random
      length: 256
      seed: 42

tx:
  count: 1
