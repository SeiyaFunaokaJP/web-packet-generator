# IS-IS (ISO 10589): a Level 2 LAN Hello with clear-text authentication (unpadded)
schema: 1

meta:
  name: isis-l2-lan-hello
  descriptions:
    ja: "IS-IS (ISO 10589): 平文認証付きのレベル 2 LAN Hello (パディングなし)"
    en: "IS-IS (ISO 10589): a Level 2 LAN Hello with clear-text authentication (unpadded)"
  tags: ["protocol:dot3", "protocol:llc", "protocol:isis_l2_lan_hello", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "01:80:c2:00:00:15" # AllL2ISs
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc
  - protocol: isis_l2_lan_hello
    fields:
      circuit_type: l2
      holding_time: 9
      priority: 100
      lan_id: "0000 0000 0002 01"
      tlvs:
        - { authentication: { auth_type: cleartext, value: "\"secret\"" } }
        - { protocols_supported: [ipv4, ipv6] }
        - { area_addresses: [{ address: "49.0001" }] }
        - { ip_interface_addresses: [192.0.2.1] }
        - { ipv6_interface_addresses: ["fe80::1"] }

tx:
  count: 1
