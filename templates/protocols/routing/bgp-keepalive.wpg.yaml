# BGP-4 (RFC 4271): a KEEPALIVE (the 19-octet header alone)
schema: 1

meta:
  name: bgp-keepalive
  descriptions:
    ja: "BGP-4 (RFC 4271): KEEPALIVE (19 オクテットのヘッダのみ)"
    en: "BGP-4 (RFC 4271): a KEEPALIVE (the 19-octet header alone)"
  tags: ["protocol:bgp", "layer:l4", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
      ttl: 1 # eBGP peers are directly connected
      dscp: 48
      flags: df
  - protocol: tcp
    fields:
      src_port: 49152
      dst_port: 179
      seq: 1001
      ack: 5001
      flags: psh|ack
  - protocol: bgp
    fields:
      type: keepalive

tx:
  count: 1
