# EIGRP (RFC 7868): a Hello with Parameters and Software Version TLVs (IP protocol 88)
schema: 1

meta:
  name: eigrp-hello
  descriptions:
    ja: "EIGRP (RFC 7868): Parameters / Software Version TLV 付きの Hello (IP プロトコル 88、224.0.0.10)"
    en: "EIGRP (RFC 7868): a Hello with Parameters and Software Version TLVs (IP protocol 88, 224.0.0.10)"
  tags: ["protocol:eigrp", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "01:00:5e:00:00:0a" # EIGRP routers 224.0.0.10
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 224.0.0.10
      ttl: 1
      dscp: 48
  - protocol: eigrp
    fields:
      opcode: hello
      autonomous_system: 100
      tlvs:
        - { parameters: { k1: 1, k2: 0, k3: 1, k4: 0, k5: 0, k6: 0, hold_time: 15 } }
        - { software_version: { os_major: 12, os_minor: 4, tlv_major: 1, tlv_minor: 2 } }

tx:
  count: 1
