# IS-IS (ISO 10589 / RFC 5303): a point-to-point Hello with the three-way adjacency TLV, padded to the MTU
schema: 1

meta:
  name: isis-p2p-hello
  descriptions:
    ja: "IS-IS (ISO 10589 / RFC 5303): 3-way 隣接 TLV 付きでMTU までパディングしたポイントツーポイント Hello"
    en: "IS-IS (ISO 10589 / RFC 5303): a point-to-point Hello with the three-way adjacency TLV, padded to the MTU"
  tags: ["protocol:dot3", "protocol:llc", "protocol:isis_p2p_hello", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "09:00:2b:00:00:05" # AllISs
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc
  - protocol: isis_p2p_hello
    fields:
      local_circuit_id: 1
      pdu_length: 1497
      tlvs:
        - { protocols_supported: [ipv4] }
        - { area_addresses: [{ address: "49.0001" }] }
        - { ip_interface_addresses: [10.0.0.1] }
        - p2p_adjacency_state:
            adjacency_state: up
            extended_local_circuit_id: 1
            neighbor_system_id: "0000 0000 0002"
            neighbor_extended_local_circuit_id: 1

tx:
  count: 1
