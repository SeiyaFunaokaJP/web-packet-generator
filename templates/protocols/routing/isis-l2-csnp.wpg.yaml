# IS-IS (ISO 10589): a Level 2 CSNP describing two LSPs over the whole LSP ID range
schema: 1

meta:
  name: isis-l2-csnp
  descriptions:
    ja: "IS-IS (ISO 10589): LSP ID 全範囲で 2 つの LSP を記述するレベル 2 CSNP"
    en: "IS-IS (ISO 10589): a Level 2 CSNP describing two LSPs over the whole LSP ID range"
  tags: ["protocol:dot3", "protocol:llc", "protocol:isis_l2_csnp", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "01:80:c2:00:00:15"
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc
  - protocol: isis_l2_csnp
    fields:
      source_id: "0000 0000 0001 00"
      start_lsp_id: "0000 0000 0000 00 00"
      end_lsp_id: "ffff ffff ffff ff ff"
      tlvs:
        - lsp_entries:
            entries:
              - { remaining_lifetime: 1199, lsp_id: "0000 0000 0001 00 00", sequence_number: 5, checksum: 0x1a2b }
              - { remaining_lifetime: 1100, lsp_id: "0000 0000 0002 00 00", sequence_number: 3, checksum: 0x3c4d }

tx:
  count: 1
