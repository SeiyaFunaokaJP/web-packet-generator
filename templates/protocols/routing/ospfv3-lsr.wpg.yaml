# OSPFv3 (RFC 5340): a Link State Request for a Router-LSA
schema: 1

meta:
  name: ospfv3-lsr
  descriptions:
    ja: "OSPFv3 (RFC 5340): Router-LSA を要求する Link State Request"
    en: "OSPFv3 (RFC 5340): a Link State Request for a Router-LSA"
  tags: ["protocol:ospfv3", "protocol:ospfv3_lsr", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv6
    fields:
      src: fe80::1
      dst: fe80::2
      hop_limit: 1
      dscp: 48 # CS6 (network control)
  - protocol: ospfv3
    fields:
      router_id: 192.0.2.1
  - protocol: ospfv3_lsr
    fields:
      requests:
        - { ls_type: 0x2001, link_state_id: 0, advertising_router: 192.0.2.2 }

tx:
  count: 1
