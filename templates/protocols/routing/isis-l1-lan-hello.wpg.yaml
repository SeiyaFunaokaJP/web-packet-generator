# IS-IS (ISO 10589): a Level 1 LAN Hello padded to the MTU with Padding TLVs
schema: 1

meta:
  name: isis-l1-lan-hello
  descriptions:
    ja: "IS-IS (ISO 10589): Padding TLV で MTU まで埋めたレベル 1 LAN Hello"
    en: "IS-IS (ISO 10589): a Level 1 LAN Hello padded to the MTU with Padding TLVs"
  tags: ["protocol:dot3", "protocol:llc", "protocol:isis_l1_lan_hello", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "01:80:c2:00:00:14" # AllL1ISs
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc # dsap / ssap become 0xfe automatically
  - protocol: isis_l1_lan_hello
    fields:
      source_id: "0000 0000 0001"
      priority: 64
      lan_id: "0000 0000 0001 01" # this router is the DIS, pseudonode 1
      # Manual PDU length: Padding TLVs fill the PDU up to it (MTU 1500 - LLC 3).
      pdu_length: 1497
      tlvs:
        - { protocols_supported: [ipv4] }
        - { area_addresses: [{ address: "49.0001" }] }
        - { ip_interface_addresses: [192.0.2.1] }
        - { is_neighbors: ["02:00:00:00:00:02"] }

tx:
  count: 1
