# OSPFv3 (RFC 5340): a Link State Acknowledgment for one LSA
schema: 1

meta:
  name: ospfv3-lsack
  descriptions:
    ja: "OSPFv3 (RFC 5340): LSA 1 つを確認応答する Link State Acknowledgment"
    en: "OSPFv3 (RFC 5340): a Link State Acknowledgment for one LSA"
  tags: ["protocol:ospfv3", "protocol:ospfv3_lsack", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "33:33:00:00:00:05" # AllSPFRouters ff02::5
      src: "02:00:00:00:00:01"
  - protocol: ipv6
    fields:
      src: fe80::1
      dst: ff02::5
      hop_limit: 1
      dscp: 48 # CS6 (network control)
  - protocol: ospfv3
    fields:
      router_id: 192.0.2.1
  - protocol: ospfv3_lsack
    fields:
      lsa_headers:
        - { ls_age: 1, ls_type: 0x2001, link_state_id: 0, advertising_router: 192.0.2.2, ls_sequence: 0x80000001, ls_checksum: 0x1234, length: 40 }

tx:
  count: 1
