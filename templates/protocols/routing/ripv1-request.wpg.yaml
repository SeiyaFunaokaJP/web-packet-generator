# RIPv1 (RFC 1058): a broadcast Request for the whole routing table
schema: 1

meta:
  name: ripv1-request
  descriptions:
    ja: "RIPv1 (RFC 1058): ルーティングテーブル全体を要求するブロードキャスト Request (AFI 0、メトリック 16)"
    en: "RIPv1 (RFC 1058): a broadcast Request for the whole routing table (AFI 0, metric 16)"
  tags: ["protocol:rip", "layer:l4", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "ff:ff:ff:ff:ff:ff"
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 255.255.255.255
      ttl: 1
  - protocol: udp
    fields:
      src_port: 520
      dst_port: 520
  - protocol: rip
    fields:
      command: request
      version: 1
      entries:
        - { afi: 0, metric: 16 }

tx:
  count: 1
