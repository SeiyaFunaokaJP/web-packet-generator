# IS-IS (ISO 10589 / RFC 1195): a Level 1 LSP with narrow-metric IS and IP reachability
schema: 1

meta:
  name: isis-l1-lsp
  descriptions:
    ja: "IS-IS (ISO 10589 / RFC 1195): ナローメトリックの IS / IP 到達性を持つレベル 1 LSP"
    en: "IS-IS (ISO 10589 / RFC 1195): a Level 1 LSP with narrow-metric IS and IP reachability"
  tags: ["protocol:dot3", "protocol:llc", "protocol:isis_l1_lsp", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "01:80:c2:00:00:14"
      src: "02:00:00:00:00:01"
      length: auto
  - protocol: llc
  - protocol: isis_l1_lsp
    fields:
      remaining_lifetime: 1199
      lsp_id: "0000 0000 0001 00 00"
      sequence_number: 5
      # checksum: Auto (Fletcher from the LSP ID on)
      tlvs:
        - { area_addresses: [{ address: "49.0001" }] }
        - { protocols_supported: [ipv4] }
        - { dynamic_hostname: "\"r1\"" }
        - is_reachability:
            neighbors:
              - { default_metric: 10, neighbor_id: "0000 0000 0001 01" } # the pseudonode
        - ip_internal_reachability:
            prefixes:
              - { default_metric: 10, ip_address: 192.0.2.0, subnet_mask: 255.255.255.0 }
              - { default_metric: 0, ip_address: 192.0.2.1, subnet_mask: 255.255.255.255 }

tx:
  count: 1
