# OSPFv3 (RFC 5340): a Hello to AllSPFRouters ff02::5 (IPv6 next header 89)
schema: 1

meta:
  name: ospfv3-hello
  descriptions:
    ja: "OSPFv3 (RFC 5340): ff02::5 宛ての Hello (IPv6 疑似ヘッダ付きチェックサム)"
    en: "OSPFv3 (RFC 5340): a Hello to ff02::5 (checksum with the IPv6 pseudo header)"
  tags: ["protocol:ospfv3", "protocol:ospfv3_hello", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "33:33:00:00:00:05" # AllSPFRouters ff02::5
      src: "02:00:00:00:00:01"
  - protocol: ipv6
    fields:
      src: fe80::1
      dst: ff02::5
      hop_limit: 1
      dscp: 48 # CS6 (network control)
  - protocol: ospfv3
    fields:
      router_id: 192.0.2.1
      area_id: 0.0.0.0
      instance_id: 0
  - protocol: ospfv3_hello
    fields:
      interface_id: 5
      router_priority: 1
      options: v6|e|r
      hello_interval: 10
      router_dead_interval: 40
      designated_router: 192.0.2.1
      neighbors: [192.0.2.2]

tx:
  count: 1
