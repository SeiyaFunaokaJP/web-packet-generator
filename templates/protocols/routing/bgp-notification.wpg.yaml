# BGP-4 (RFC 4271): a NOTIFICATION Cease / Administrative Shutdown
schema: 1

meta:
  name: bgp-notification
  descriptions:
    ja: "BGP-4 (RFC 4271): Cease / Administrative Shutdown の NOTIFICATION"
    en: "BGP-4 (RFC 4271): a NOTIFICATION Cease / Administrative Shutdown"
  tags: ["protocol:bgp", "protocol:bgp_notification", "layer:l4", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "02:00:00:00:00:02"
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 192.0.2.2
      ttl: 1 # eBGP peers are directly connected
      dscp: 48
      flags: df
  - protocol: tcp
    fields:
      src_port: 49152
      dst_port: 179
      seq: 1001
      ack: 5001
      flags: psh|ack
  - protocol: bgp
  - protocol: bgp_notification
    fields:
      error_code: cease
      error_subcode: 2 # Administrative Shutdown (RFC 4486)
      data: ""

tx:
  count: 1
