# OSPFv2 (RFC 2328): a Link State Update carrying an AS-External-LSA (type 5)
schema: 1

meta:
  name: ospfv2-lsu-external-lsa
  descriptions:
    ja: "OSPFv2 (RFC 2328): ASBR が生成する AS-External-LSA (タイプ 5、E2 メトリック) を運ぶ Link State Update"
    en: "OSPFv2 (RFC 2328): a Link State Update carrying an ASBR's AS-External-LSA (type 5, E2 metric)"
  tags: ["protocol:ospfv2", "protocol:ospfv2_lsu", "protocol:ospfv2_lsa", "protocol:ospfv2_external_lsa", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-11

layers:
  - protocol: ethernet2
    fields:
      dst: "01:00:5e:00:00:05" # AllSPFRouters 224.0.0.5
      src: "02:00:00:00:00:01"
  - protocol: ipv4
    fields:
      src: 192.0.2.1
      dst: 224.0.0.5
      ttl: 1
      dscp: 48 # CS6 (network control)
  - protocol: ospfv2
    fields:
      router_id: 192.0.2.1
      area_id: 0.0.0.0
  - protocol: ospfv2_lsu
    fields:
      num_lsas: 1
  - protocol: ospfv2_lsa
    fields:
      ls_age: 0 # the Auto LSA checksum is exact for LS age 0
      link_state_id: 203.0.113.0
      advertising_router: 192.0.2.1
      ls_sequence: 0x80000001
  - protocol: ospfv2_external_lsa
    fields:
      network_mask: 255.255.255.0
      e_bit: 1
      metric: 20
      forwarding_address: 0.0.0.0
      external_route_tag: 0

tx:
  count: 1
