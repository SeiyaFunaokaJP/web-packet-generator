    en: "IS-IS: a hand-written PDU in the generic layout (common header + opaque octets), here a Level 1 LAN Hello"
  # The parser re-decodes the generic layer by its PDU type.
  tags: ["protocol:dot3", "protocol:llc", "protocol:isis", "parse-as:isis=isis_l1_lan_hello", "layer:l3", routing, sample]
