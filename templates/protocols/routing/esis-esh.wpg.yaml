# ES-IS (ISO 9542): an end system hello announcing two NSAPs to all intermediate systems
schema: 1

meta:
  name: esis-esh
  descriptions:
    ja: "ES-IS (ISO 9542): 2 つの NSAP を全中間システムへ通知するエンドシステム Hello"
    en: "ES-IS (ISO 9542): an end system hello announcing two NSAPs to all intermediate systems"
  tags: ["protocol:dot3", "protocol:llc", "protocol:esis_esh", "layer:l3", routing, sample]
  author: wpg
  created: 2026-10-12

layers:
  - protocol: dot3
    fields:
      dst: "09:00:2b:00:00:05" # AllIntermediateSystems
      src: "02:00:00:00:00:0a"
      length: auto
  - protocol: llc
  - protocol: esis_esh
    fields:
      holding_time: 300
      # number_of_source_addresses, length_indicator and checksum: Auto
      source_addresses:
        - { address: "49.0001.0000.0000.000a.00" }
        - { address: "49.0001.0000.0000.000a.01" }

tx:
  count: 1
