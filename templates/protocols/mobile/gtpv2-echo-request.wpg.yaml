    en: "GTPv2-C (3GPP TS 29.274): an Echo Request with the Recovery IE (no TEID, the T flag is Auto 0)"
  tags: ["protocol:ethernet2", "protocol:ipv4", "protocol:udp", "protocol:gtpv2", "layer:l4", mobile, sample]
