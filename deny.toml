# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
# Run: cargo deny check

[graph]
all-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Add entries as { id = "RUSTSEC-YYYY-NNNN", reason = "..." } with a justification.
    # Both are compile-time-only proc-macro helpers pulled in by leptos 0.8 (wpg-web);
    # "unmaintained" only, no known vulnerability. Revisit when leptos drops them.
    # Mirrored in .cargo/audit.toml for the cargo-audit workflow.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, transitive via leptos (build-time only)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained, transitive via leptos (build-time only)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# The allow list is intentionally broader than today's dependency tree.
unused-allowed-license = "allow"
# Everything here is compatible with shipping wpg as MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are `publish = false`; their license is checked via the workspace itself.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between (unpublished) workspace crates are not wildcards we care about.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Keep the TLS story on rustls (TODO §2.6); OpenSSL complicates static 3-OS builds.
    { crate = "openssl-sys", reason = "use rustls instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
