    "RUSTSEC-2024-0436",
    # proc-macro-error2: unmaintained, compile-time only, via leptos 0.8.21 (syn_derive).
    # leptos 0.8.22 drops it but is pinned back until server_fn_macro_default moves to
    # syn 3 (see #22); revisit then.
    "RUSTSEC-2026-0173",
]
