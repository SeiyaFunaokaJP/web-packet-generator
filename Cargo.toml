[workspace]
resolver = "2"
members = [
    "crates/wpg-core",
    "crates/wpg-protocols",
    "crates/wpg-tx",
    "crates/wpg-rx",
    "crates/wpg-template",
    "crates/wpg-i18n",
    "crates/wpg-server",
    "crates/wpg-cli",
    "crates/wpg-web",
]
# `wpg-web` is a Leptos CSR front-end whose real target is `wasm32-unknown-unknown`
# (built via Trunk). It still compiles natively (only the browser entry point would
# fail at runtime), so `cargo clippy/test --workspace` covers it as well. It is left out
# of `default-members` so that a plain `cargo build` / `cargo run` only builds the
# native server/CLI side and does not pull the whole front-end dependency tree.
default-members = [
    "crates/wpg-core",
    "crates/wpg-protocols",
    "crates/wpg-tx",
    "crates/wpg-rx",
    "crates/wpg-template",
    "crates/wpg-i18n",
    "crates/wpg-server",
    "crates/wpg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SeiyaFunaokaJP/web-packet-generator"
homepage = "https://github.com/SeiyaFunaokaJP/web-packet-generator"
authors = ["web-packet-generator contributors"]
# Nothing is published to crates.io yet (M0). Flip per crate when that changes.
publish = false

[workspace.dependencies]
# --- internal crates ---
wpg-core = { path = "crates/wpg-core", version = "0.1.0" }
wpg-protocols = { path = "crates/wpg-protocols", version = "0.1.0" }
wpg-tx = { path = "crates/wpg-tx", version = "0.1.0" }
wpg-rx = { path = "crates/wpg-rx", version = "0.1.0" }
wpg-template = { path = "crates/wpg-template", version = "0.1.0" }
wpg-i18n = { path = "crates/wpg-i18n", version = "0.1.0" }
wpg-server = { path = "crates/wpg-server", version = "0.1.0" }

# --- shared third-party crates ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8.7"
tower = { version = "0.5.2", features = ["util"] }
# test-only: `#[tokio::test]` in wpg-server integration tests reuses the tokio entry above
rust-embed = { version = "8.9", features = ["mime-guess"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
leptos = { version = "0.8.12", features = ["csr"] }
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.81", features = ["Navigator", "Window"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A deliberately small, hand-picked subset of `clippy::pedantic`; enabling the whole
# group is too noisy for a protocol codebase full of bit twiddling.
cast_lossless = "warn"
cast_possible_truncation = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
# A few `restriction` lints that keep debugging leftovers out of main.
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Size-optimised profile for the WASM front-end: `trunk build --cargo-profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
